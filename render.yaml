# Render Blueprint — deploy gratis ke https://<nama>.onrender.com
# Cara pakai: push repo ini ke GitHub, lalu di https://dashboard.render.com
# pilih "New +" → "Blueprint" → pilih repo ini. Render akan membaca file ini otomatis.

services:
  - type: web
    name: kuislive
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Password login guru — GANTI nilai di bawah sebelum deploy publik!
      - key: ADMIN_PASSWORD
        value: "guru123"
      # Catatan: PORT tidak di-set di sini — Render otomatis menyediakan PORT
      # dan aplikasi membaca process.env.PORT.
    healthCheckPath: /
